[package]

# Semantic Versioning is used: https://semver.org/
version = "0.1.0"

# Description
category = "isaaclab"
readme  = "README.md"

title = "Allegro Hand V5 Sense - Isaac Lab Pipeline"
author = "Isaac Lab Project Developers"
maintainer = "Isaac Lab Project Developers"
description="Allegro Hand V5 sense (left + right) scene and RL environment for Isaac Lab"
repository = "https://github.com/isaac-sim/IsaacLab.git"
keywords = ["allegro hand", "dexterous manipulation", "bimanual", "isaaclab"]

[dependencies]
"isaaclab" = {}
"isaaclab_assets" = {}
"isaaclab_mimic" = {}
"isaaclab_rl" = {}
"isaaclab_tasks" = {}
# NOTE: Add additional dependencies here

[[python.module]]
name = "v5_sense_isaaclab_pipeline"

# UI extension module: Kit imports this submodule directly and scans it for ``omni.ext.IExt``
# subclasses. Kept separate from the package root so ``import v5_sense_isaaclab_pipeline`` stays omni-free headless.
[[python.module]]
name = "v5_sense_isaaclab_pipeline.ui_extension_example"

